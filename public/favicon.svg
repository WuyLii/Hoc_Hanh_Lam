<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A" />
      <stop offset="100%" stop-color="#2D2D2D" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Dark Circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)" />

  <!-- Gold Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#F59E0B" stroke-width="8" opacity="0.8" />
  <circle cx="256" cy="256" r="212" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.6" />
  <circle cx="256" cy="256" r="190" fill="url(#glow)" />

  <!-- Open Book Wings -->
  <g transform="translate(256, 275)">
    <path d="M -90,20 C -55,0 -20,10 0,30 C 20,10 55,0 90,20 L 90,-40 C 55,-60 20,-50 0,-30 C -20,-50 -55,-60 -90,-40 Z" fill="#FFFFFF" opacity="0.95" />
    <path d="M -85,15 C -50,-3 -15,7 0,25 C 15,7 50,-3 85,15" fill="none" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round" />

    <!-- Graduation Cap -->
    <polygon points="0,-120 80,-80 0,-40 -80,-80" fill="#F59E0B" />
    <polygon points="0,-120 80,-80 0,-65 -80,-80" fill="#FBBF24" />
    <path d="M -45,-65 L -45,-38 C -45,-20 45,-20 45,-38 L 45,-65" fill="none" stroke="#D97706" stroke-width="8" stroke-linecap="round" />
    <path d="M 60,-72 L 78,-35 L 78,-15" fill="none" stroke="#FBBF24" stroke-width="6" stroke-linecap="round" />
    <circle cx="78" cy="-8" r="7" fill="#FBBF24" />

    <!-- AI Sparkle -->
    <path d="M 0,-15 L 6,-5 L 16,0 L 6,5 L 0,15 L -6,5 L -16,0 L -6,-5 Z" fill="#1A1A1A" />
  </g>
</svg>
